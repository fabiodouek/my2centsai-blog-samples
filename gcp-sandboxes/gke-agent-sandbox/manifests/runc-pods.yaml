# A runc pod on the system node (for comparison) and a plain HTTP target that every probe tries to reach.
apiVersion: v1
kind: Pod
metadata: {name: runc-probe, namespace: default, labels: {role: runc}}
spec:
  nodeSelector: {cloud.google.com/gke-nodepool: default-pool}
  containers:
  - {name: probe, image: "python:3.12-slim", command: ["sleep", "infinity"]}
---
apiVersion: v1
kind: Pod
metadata: {name: target, namespace: default, labels: {role: target}}
spec:
  nodeSelector: {cloud.google.com/gke-nodepool: default-pool}
  containers:
  - {name: http, image: "python:3.12-slim", command: ["python3", "-m", "http.server", "8888"]}
