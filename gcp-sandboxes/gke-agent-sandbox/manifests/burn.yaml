# The same CPU-and-log workload as a runc pod (system node) and as a gVisor Sandbox (limit 500m each), for Test 7.
apiVersion: v1
kind: Pod
metadata: {name: burn-runc, namespace: default, labels: {app: burn, runtime: runc}}
spec:
  nodeSelector: {cloud.google.com/gke-nodepool: default-pool}
  containers:
  - name: burn
    image: python:3.12-slim
    command: ["python3", "-u", "-c"]
    args: ["import time\nx = bytearray(100 * 1024 * 1024)\nt = time.time()\nwhile True:\n  s = time.time()\n  while time.time() - s < 1.0: pass  # busy for the whole second\n  print('tick', int(time.time() - t), flush=True)"]
    resources: {requests: {cpu: 100m, memory: 150Mi}, limits: {cpu: 500m, memory: 300Mi}}
---
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata: {name: burn-gvisor, namespace: default}
spec:
  podTemplate:
    metadata: {labels: {app: burn, runtime: gvisor}}
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000}
      nodeSelector: {sandbox.gke.io/runtime: gvisor}
      tolerations: [{key: sandbox.gke.io/runtime, value: gvisor, effect: NoSchedule}]
      containers:
      - name: burn
        image: python:3.12-slim
        command: ["python3", "-u", "-c"]
        args: ["import time\nx = bytearray(100 * 1024 * 1024)\nt = time.time()\nwhile True:\n  s = time.time()\n  while time.time() - s < 1.0: pass  # busy for the whole second\n  print('tick', int(time.time() - t), flush=True)"]
        securityContext: {capabilities: {drop: [ALL]}, allowPrivilegeEscalation: false}
        resources: {requests: {cpu: 100m, memory: 150Mi}, limits: {cpu: 500m, memory: 300Mi}}
