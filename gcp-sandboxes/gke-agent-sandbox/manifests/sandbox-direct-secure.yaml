# A Sandbox created directly (no template): same pod spec, gVisor, passes the policy.
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: direct-sandbox
  namespace: default
spec:
  podTemplate:
    metadata:
      labels:
        sandbox: direct
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      nodeSelector:
        sandbox.gke.io/runtime: gvisor
      tolerations:
      - key: "sandbox.gke.io/runtime"
        value: "gvisor"
        effect: "NoSchedule"
      containers:
      - name: probe
        image: python:3.12-slim
        command: ["sleep", "infinity"]
        securityContext:
          capabilities:
            drop: ["ALL"]
          allowPrivilegeEscalation: false
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
