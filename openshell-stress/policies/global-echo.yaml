# 03_policy_propagation.py --scope global: one gateway-global policy that lets every sandbox's
# Python reach the echo server. It replaces EVERY sandbox's policy on the gateway until
# `openshell policy delete --global` (the script deletes it at the end), so it is only for
# a cluster that runs nothing else.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  p6_echo:
    endpoints:
      - host: echo.echo.svc.cluster.local
        port: 80
    binaries:
      - path: /usr/bin/python3.12
