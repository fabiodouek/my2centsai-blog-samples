# The starting policy for every part 6 sandbox: the same filesystem rules as OpenShell's
# default policy, and no network rules, so every connection is denied.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: best_effort
