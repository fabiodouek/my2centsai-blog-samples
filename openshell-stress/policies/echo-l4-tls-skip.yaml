# Egress ladder, rung "l4-tls-skip": Python may connect to the echo server; the supervisor
# relays the bytes without looking at them (no TLS handling, no HTTP parsing).
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  echo:
    endpoints:
      - host: echo.echo.svc.cluster.local
        port: 80
        tls: skip
    binaries:
      - path: /usr/bin/python3.12
