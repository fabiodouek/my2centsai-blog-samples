# The second global revision in 03 --scope global: the same access plus an unused rule, so the
# only effect is a new policy generation (which closes connections opened under the old one).
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  p6_echo:
    endpoints:
      - host: echo.echo.svc.cluster.local
        port: 80
    binaries:
      - path: /usr/bin/python3.12
  p6_marker:
    endpoints:
      - host: echo.echo.svc.cluster.local
        port: 81
    binaries:
      - path: /usr/bin/python3.12
