# Egress ladder, rung "rest-enforce": REST inspection with explicit allow rules, enforced.
# The benchmark only sends GET and POST under /bench/, so every request matches a rule.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  echo:
    endpoints:
      - host: echo.echo.svc.cluster.local
        port: 80
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /bench/**
          - allow:
              method: POST
              path: /bench/**
    binaries:
      - path: /usr/bin/python3.12
