# 06_noisy_neighbors.py's hog sandboxes: no network rules, and the default filesystem rules plus
# read access to /dev/zero, which dd reads from (Landlock denies it under the default policy).
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /dev/zero, /etc, /var/log]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: best_effort
