# Egress ladder, rung "rest-audit": every request is parsed as REST and checked against the
# access preset; enforcement defaults to audit, so a violation would only be logged.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  echo:
    endpoints:
      - host: echo.echo.svc.cluster.local
        port: 80
        protocol: rest
        access: full
    binaries:
      - path: /usr/bin/python3.12
