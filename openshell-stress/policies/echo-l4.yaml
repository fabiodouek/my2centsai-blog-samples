# Egress ladder, rung "l4": the same destination without tls: skip. No request rules, but the
# supervisor checks that each HTTP request is addressed to this host and has a well-formed
# path (and would terminate TLS if the client spoke it). 03 and 06 use it as "echo allowed".
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  echo:
    endpoints:
      - host: echo.echo.svc.cluster.local
        port: 80
    binaries:
      - path: /usr/bin/python3.12
