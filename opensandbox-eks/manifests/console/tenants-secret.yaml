# Replaces console/k8s/tenants-configmap.example.yaml. The BFF needs a tenants.toml (it logs
# developers in by looking their key up there). It holds a real key, so it is a Secret here
# instead of the example's ConfigMap. The key is the server's own API key (OSB_API_KEY in
# .env): the server stays in single-key mode and accepts it when the BFF forwards it. The
# namespace is where the sandboxes run; the BFF only uses it for its Kubernetes lookups.
# 06_console.sh fills in the key and applies this through stdin.
apiVersion: v1
kind: Secret
metadata:
  name: opensandbox-tenants
  namespace: opensandbox-system
  labels:
    app.kubernetes.io/name: opensandbox-console-bff
type: Opaque
stringData:
  tenants.toml: |
    [[tenants]]
    name = "default"
    namespace = "opensandbox"
    api_keys = ["${OSB_API_KEY}"]
