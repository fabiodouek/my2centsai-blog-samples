# From console/k8s/console-bff-secret.example.yaml. 06_console.sh fills in the two values from
# .env with envsubst and applies the result through stdin, so they are never stored here.
apiVersion: v1
kind: Secret
metadata:
  name: opensandbox-console-bff
  namespace: opensandbox-system
  labels:
    app.kubernetes.io/name: opensandbox-console-bff
type: Opaque
stringData:
  BFF_SESSION_SECRET: "${BFF_SESSION_SECRET}"
  BFF_ADMIN_TOKEN: "${BFF_ADMIN_TOKEN}"
