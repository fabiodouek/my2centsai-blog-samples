# A tiny HTTP server that answers every request with what it received: method, path, headers and
# body length, as JSON. Sandboxes use it as an allowed destination, so the tests can show exactly
# what leaves the supervisor. GET /slow?seconds=N streams one line a second (a long-lived
# connection for the live-update test). It runs the series' workload image from ECR, as a
# non-root user. 00_echo.sh fills in ${IMAGE}.
apiVersion: v1
kind: Namespace
metadata:
  name: echo
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: echo
  namespace: echo
data:
  echo.py: |
    import json, sys, time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import urlsplit, parse_qs

    class Echo(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def _reply(self):
            length = int(self.headers.get("Content-Length") or 0)
            body = self.rfile.read(length) if length else b""
            url = urlsplit(self.path)
            if url.path == "/slow":
                seconds = int(parse_qs(url.query).get("seconds", ["30"])[0])
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.send_header("Transfer-Encoding", "chunked")
                self.end_headers()
                for i in range(seconds):
                    line = f"tick {i + 1}\n".encode()
                    self.wfile.write(b"%x\r\n%s\r\n" % (len(line), line))
                    self.wfile.flush()
                    time.sleep(1)
                self.wfile.write(b"0\r\n\r\n")
                return
            out = json.dumps({"method": self.command, "path": self.path,
                              "headers": dict(self.headers.items()),
                              "body_bytes": len(body)}, indent=1).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(out)))
            self.end_headers()
            self.wfile.write(out)

        do_GET = do_POST = do_PUT = do_DELETE = do_PATCH = _reply

        def log_message(self, fmt, *args):
            sys.stderr.write("%s %s\n" % (self.command, self.path))

    ThreadingHTTPServer(("0.0.0.0", 8080), Echo).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: echo
spec:
  replicas: 1
  selector:
    matchLabels: {app: echo}
  template:
    metadata:
      labels: {app: echo}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: echo
          image: ${IMAGE}
          command: ["python3", "-u", "/app/echo.py"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: app, mountPath: /app}]
      volumes:
        - name: app
          configMap: {name: echo}
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: echo
spec:
  selector: {app: echo}
  ports: [{port: 80, targetPort: 8080}]
