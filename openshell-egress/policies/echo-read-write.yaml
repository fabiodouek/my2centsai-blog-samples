# The echo server for curl and python3, matching the echo-demo provider profile's endpoint, so
# the host stays reachable after the provider is detached (08_rotation.sh).
version: 1
# The filesystem and Landlock sections match the default policy: a running sandbox accepts new
# network rules, but not removed paths or a changed Landlock mode.
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  echo:
    name: echo-rest
    endpoints:
      - { host: echo.echo.svc.cluster.local, port: 80, protocol: rest, access: read-write, enforcement: enforce }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/python3.12 }
