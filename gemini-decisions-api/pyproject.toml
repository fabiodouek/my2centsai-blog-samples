[project]
name = "gemini-decisions-api"
version = "0.1.0"
description = "Companion code for the my2cents.ai deep dive: Getting started with the Gemini Decisions API"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Only needed to regenerate the sample ticket media in assets/ (make_assets.py).
assets = ["pillow>=10", "fpdf2>=2.7"]
