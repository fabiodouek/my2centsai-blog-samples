[project]
name = "my2cents-ws-backend"
version = "0.1.0"
description = "Lambda MicroVM workspace API: sandboxes, terminal bridge, iron-proxy feed (my2cents.ai part 3)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "boto3==1.43.123",
    "websockets>=15.0.1",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.9",
    "pydantic>=2.9",
    "ruamel-yaml>=0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
