# tmux for the workspace sandbox. The browser terminal (xterm.js) runs `tmux new -A -s main` on every
# connect, so the session (and Claude Code inside it) outlives WebSocket drops and suspend/resume.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:extkeys:clipboard"
set -s escape-time 10
set -g history-limit 50000
set -g focus-events on
set -g extended-keys on
set -g set-clipboard on
# Wheel scrolls tmux history. Native text selection in xterm.js: Shift+drag (Option+drag on macOS
# when the frontend sets macOptionClickForcesSelection).
set -g mouse on
# Several browser tabs can attach at once; size to the most recently active one, not the smallest.
set -g window-size latest
setw -g aggressive-resize on
# Status bar in the web UI's warm-charcoal/brass palette
set -g status-style "bg=#211d1a,fg=#969189"
set -g window-status-current-style "fg=#e1b761"
set -g status-left "#[fg=#e1b761] #S #[default]"
# Sandbox name from the run-hook payload (SANDBOX_NAME in /etc/sandbox.env), re-read on every status refresh so it
# doesn't matter when the tmux server started. Single quotes: tmux expands ${...} inside double-quoted config strings.
set -g status-right '#[fg=#969189]#(. /etc/sandbox.env 2>/dev/null; echo "${SANDBOX_NAME:-sandbox}") · C-b d detaches '
set -g status-left-length 20
set -g status-right-length 60
