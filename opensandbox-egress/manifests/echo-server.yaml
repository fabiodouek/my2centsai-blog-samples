# The in-cluster echo server for part 4. It answers any method on any path with the request it
# received, as JSON: method, path, every header exactly as it arrived, the body, and which of its
# two listeners took the connection. The CA trust, leak, substitution, rotation and pause tests send dummy credentials
# to it, so what a sandbox's request looks like at the destination is something you can read.
#
# Two Services point at the one pod, on different container ports:
#   echo      echo.opensandbox.svc.cluster.local      port 80 -> listener 8080
#   echo-alt  echo-alt.opensandbox.svc.cluster.local  port 80 -> listener 8081
# The Host-header test (06_leaks.py) needs two distinct allowed destinations; "listener" in the reply
# says which one a request really reached.
#
# Plain HTTP on port 80 on purpose: the egress sidecar's transparent proxy intercepts ports 80 and
# 443 only, and a binding with schemes ["http"] injects there. (A TLS echo on 443 would also work.)
#
# 00_echo.sh fills in ${ECR_REGISTRY} and ${ECR_PREFIX} from ../opensandbox-eks/env.sh and applies it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: echo-script
  namespace: opensandbox
  labels: {app: echo, example: opensandbox-egress}
data:
  echo.py: |
    import json
    import sys
    import threading
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import parse_qs, urlsplit


    class Echo(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def _reply(self):
            length = int(self.headers.get("Content-Length") or 0)
            body = self.rfile.read(length).decode("utf-8", "replace") if length else ""
            headers = {}
            for name, value in self.headers.items():
                headers[name] = f"{headers[name]}, {value}" if name in headers else value
            parts = urlsplit(self.path)
            if parts.path == "/stream":
                # A long-lived response: one line per interval, for the "established connection" test.
                query = parse_qs(parts.query)
                count = int(query.get("n", ["30"])[0])
                interval = float(query.get("interval", ["1"])[0])
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.send_header("Connection", "close")
                self.end_headers()
                try:
                    for i in range(count):
                        self.wfile.write(f"tick {i + 1}/{count}\n".encode())
                        self.wfile.flush()
                        time.sleep(interval)
                except (BrokenPipeError, ConnectionResetError):
                    pass
                self.close_connection = True
                return
            payload = json.dumps({
                "method": self.command,
                "path": self.path,
                "headers": headers,
                "body": body,
                "listener": self.server.server_address[1],
                "client": self.client_address[0],
            }).encode()
            print(json.dumps({"method": self.command, "path": self.path, "headers": headers,
                              "body": body, "listener": self.server.server_address[1]}), flush=True)
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        do_GET = do_POST = do_PUT = do_PATCH = do_DELETE = do_HEAD = _reply

        def log_message(self, *args):
            pass


    def serve(port):
        ThreadingHTTPServer(("0.0.0.0", port), Echo).serve_forever()


    for port in (8081,):
        threading.Thread(target=serve, args=(port,), daemon=True).start()
    print("echo listening on 8080 and 8081", flush=True)
    sys.stdout.flush()
    serve(8080)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: opensandbox
  labels: {app: echo, example: opensandbox-egress}
spec:
  replicas: 1
  selector:
    matchLabels: {app: echo}
  template:
    metadata:
      labels: {app: echo, example: opensandbox-egress}
    spec:
      containers:
        - name: echo
          image: ${ECR_REGISTRY}/${ECR_PREFIX}/python:3.12-slim
          command: ["python3", "-u", "/app/echo.py"]
          ports:
            - {name: http, containerPort: 8080}
            - {name: http-alt, containerPort: 8081}
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: script, mountPath: /app, readOnly: true}
      volumes:
        - name: script
          configMap: {name: echo-script}
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: opensandbox
  labels: {app: echo, example: opensandbox-egress}
spec:
  selector: {app: echo}
  ports:
    - {name: http, port: 80, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: echo-alt
  namespace: opensandbox
  labels: {app: echo, example: opensandbox-egress}
spec:
  selector: {app: echo}
  ports:
    - {name: http, port: 80, targetPort: 8081}
