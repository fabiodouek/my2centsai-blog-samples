[project]
name = "opensandbox-stress"
version = "0.1.0"
description = "Companion code for the my2cents.ai deep dive on OpenSandbox on Amazon EKS, part 6: the stress test (density, create latency, pause storms, egress overhead, the control plane, noisy neighbors)"
requires-python = ">=3.11"
dependencies = [
    "opensandbox==1.2.0",
    "httpx>=0.27",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
